spring.application.name=gasvolcan-api
server.port=8080

# ---- Base de datos MySQL ----
# La base "gasvolcan" se crea sola si no existe. Usuario y clave por variables de entorno
# DB_USER y DB_PASSWORD (por defecto root sin clave).
spring.datasource.url=jdbc:mysql://localhost:3306/gasvolcan?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JWT ----
# La clave debe tener al menos 32 caracteres. En un sistema real va en una variable de entorno (JWT_SECRET).
jwt.secret=${JWT_SECRET:gas-el-volcan-clave-secreta-de-desarrollo-2026-cambiar}
jwt.access-minutos=30
jwt.refresh-dias=7

# ---- Swagger ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
